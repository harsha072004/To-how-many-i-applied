<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 To How Many I Applied</h1>
            <p>Your Personal Job Application Tracker</p>
        </header>

        <!-- Statistics Section -->
        <section class="stats-container">
            <div class="stat-card">
                <h3>Total</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Applied</h3>
                <p id="stat-applied">0</p>
            </div>
            <div class="stat-card highlight">
                <h3>Interviews</h3>
                <p id="stat-interviews">0</p>
            </div>
            <div class="stat-card">
                <h3>Rejected</h3>
                <p id="stat-rejected">0</p>
            </div>
        </section>

        <div class="main-content">
            <!-- Add Application Form -->
            <section class="form-section">
                <h2>Add New Application</h2>
                <form id="add-form">
                    <div class="form-group">
                        <label>Company Name *</label>
                        <input type="text" id="companyName" required>
                    </div>
                    <div class="form-group">
                        <label>Job Role *</label>
                        <input type="text" id="role" required>
                    </div>
                    <div class="form-group">
                        <label>Date Applied *</label>
                        <input type="date" id="appliedDate" required>
                    </div>
                    <div class="form-group">
                        <label>Status *</label>
                        <select id="status" required>
                            <option value="APPLIED">Applied</option>
                            <option value="UNDER_REVIEW">Under Review</option>
                            <option value="SHORTLISTED">Shortlisted</option>
                            <option value="INTERVIEW">Interview</option>
                            <option value="SELECTED">Selected</option>
                            <option value="REJECTED">Rejected</option>
                            <option value="NO_RESPONSE">No Response</option>
                            <option value="WITHDRAWN">Withdrawn</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="notes" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Save Application</button>
                    <p id="form-message" class="message"></p>
                </form>
            </section>

            <!-- Applications Table -->
            <section class="table-section">
                <h2>Recent Applications</h2>
                <div class="table-responsive">
                    <table id="applications-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Company</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Heard Back?</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Data will be injected here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
